<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TXT Reader Metadata Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="popup-header">
      <div class="popup-mark" aria-hidden="true">TR</div>
      <div class="popup-heading">
        <h1>메타데이터 도우미</h1>
        <p class="shortcut-hint"><span>열기</span> <kbd id="shortcut-key">Ctrl+Shift+Y</kbd></p>
      </div>
      <p class="popup-description">작품 연결부터 상세 캡처와 가져오기까지 한 흐름으로 처리합니다.</p>
    </header>

    <ol class="flow-steps" aria-label="캡처 진행 단계">
      <li data-flow-step="pair" aria-label="1단계 작품 연결"><span class="step-number">1</span><span class="step-label">연결</span></li>
      <li data-flow-step="capture" aria-label="2단계 상세 캡처"><span class="step-number">2</span><span class="step-label">캡처</span></li>
      <li data-flow-step="import" aria-label="3단계 자동 가져오기"><span class="step-number">3</span><span class="step-label">가져오기</span></li>
    </ol>

    <section class="guide-card" aria-labelledby="guide-title">
      <strong id="guide-title"><span id="stage-badge">준비</span> 현재 단계</strong>
      <p id="guide">TXT Reader의 안내에 따라 현재 작품의 제한된 메타데이터만 전달합니다.</p>
    </section>

    <dl id="pairing-summary" class="summary" aria-label="연결 정보"></dl>

    <div id="action-stack" class="action-stack" hidden>
      <button id="import-button" type="button" hidden></button>
      <button id="reset-button" class="secondary hidden" type="button">캡처 작업 취소</button>
    </div>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="url-policy.js"></script>
  <script src="popup.js"></script>
</body>
</html>
