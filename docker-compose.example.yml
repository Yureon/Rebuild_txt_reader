services:
  txt_reader:
    build:
      context: .
      dockerfile: Dockerfile
    image: txt-reader-rebuild:latest
    container_name: txt_reader
    ports:
      - "${TXT_READER_BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"
    volumes:
      # /app/data stores accounts, sessions, user state, audit log, and runtime caches.
      # Create ./data on the LXC/host first and make it writable by either:
      #   - UID:GID 1000:1000 owner-write, or
      #   - root:root group-write, e.g. drwxrwxr-x.
      # The image runs as non-root UID 1000 with primary GID 0.
      # create_host_path:false prevents Docker Compose from silently creating ./data as root:root.
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - ${LIBRARY_PATH}:/library:${LIBRARY_MOUNT_MODE:-ro}
    environment:
      - LOGINID=${LOGINID}
      - LOGINPW=${LOGINPW}
      - OWNER_PASSWORD_MIN_LENGTH=${OWNER_PASSWORD_MIN_LENGTH:-14}
      - USER_PASSWORD_MIN_LENGTH=${USER_PASSWORD_MIN_LENGTH:-8}
      - PORT=3000
      - LIBRARY_PATH=/library
      - URL=${URL}
      - APP_ORIGIN=${APP_ORIGIN}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-direct}
      - REQUIRE_STRICT_ORIGIN=${REQUIRE_STRICT_ORIGIN:-1}
      - CLIENT_IP_HEADER=${CLIENT_IP_HEADER:-}
      - TRUSTED_PROXY_CIDRS=127.0.0.0/8,::1/128,172.16.0.0/12
      - SESSION_STORE_SECRET=${SESSION_STORE_SECRET:?SESSION_STORE_SECRET must be at least 16 characters}
      - SHUTDOWN_GRACE_MS=${SHUTDOWN_GRACE_MS:-45000}
      - SHUTDOWN_HTTP_DRAIN_MS=${SHUTDOWN_HTTP_DRAIN_MS:-10000}
      - MAX_TEXT_FILE_BYTES=${MAX_TEXT_FILE_BYTES:-104857600}
      - ALLOW_CLOUDFLARE_INSIGHTS=${ALLOW_CLOUDFLARE_INSIGHTS:-0}
      - ALLOW_BLOB_WORKER=${ALLOW_BLOB_WORKER:-0}
      - HOST=${HOST:-}
      - LIBRARY_DEEP_SIGNATURE_CHECK_TTL_MS=${LIBRARY_DEEP_SIGNATURE_CHECK_TTL_MS:-30000}
      - LIBRARY_DEEP_SIGNATURE_CHECK_MAX_TTL_MS=${LIBRARY_DEEP_SIGNATURE_CHECK_MAX_TTL_MS:-300000}
      - LIBRARY_SIGNATURE_CHECK_CONCURRENCY=${LIBRARY_SIGNATURE_CHECK_CONCURRENCY:-8}
      - LIBRARY_REQUEST_COLD_WAIT_MS=${LIBRARY_REQUEST_COLD_WAIT_MS:-4000}
      - LIBRARY_CATALOG_CACHE_COMPRESSION_LEVEL=${LIBRARY_CATALOG_CACHE_COMPRESSION_LEVEL:-6}
      - LIBRARY_CATALOG_CACHE_WRITE_DELAY_MS=${LIBRARY_CATALOG_CACHE_WRITE_DELAY_MS:-5000}
      - LIBRARY_COLD_FAILURE_BACKOFF_BASE_MS=${LIBRARY_COLD_FAILURE_BACKOFF_BASE_MS:-5000}
      - LIBRARY_COLD_FAILURE_BACKOFF_MAX_MS=${LIBRARY_COLD_FAILURE_BACKOFF_MAX_MS:-120000}
      - LIBRARY_SHELF_BUILD_CONCURRENCY=${LIBRARY_SHELF_BUILD_CONCURRENCY:-1}
      - LIBRARY_SHELF_BUILD_MAX_PENDING=${LIBRARY_SHELF_BUILD_MAX_PENDING:-8}
      - LIBRARY_FINGERPRINT_CONCURRENCY=${LIBRARY_FINGERPRINT_CONCURRENCY:-1}
      - LIBRARY_FINGERPRINT_QUEUE_MAX=${LIBRARY_FINGERPRINT_QUEUE_MAX:-512}
      - LIBRARY_FINGERPRINT_BACKGROUND_BATCH=${LIBRARY_FINGERPRINT_BACKGROUND_BATCH:-64}
      - LIBRARY_FINGERPRINT_ENTRY_DELAY_MS=${LIBRARY_FINGERPRINT_ENTRY_DELAY_MS:-15000}
      - LIBRARY_FINGERPRINT_SAMPLE_BYTES=${LIBRARY_FINGERPRINT_SAMPLE_BYTES:-131072}
      - LIBRARY_FINGERPRINT_SAMPLE_CHARS=${LIBRARY_FINGERPRINT_SAMPLE_CHARS:-16000}
      - LIBRARY_FINGERPRINT_MAX_ENTRIES=${LIBRARY_FINGERPRINT_MAX_ENTRIES:-100000}
      - LIBRARY_FINGERPRINT_FRESHNESS_MS=${LIBRARY_FINGERPRINT_FRESHNESS_MS:-600000}
      - LIBRARY_FINGERPRINT_COMPRESSION_LEVEL=${LIBRARY_FINGERPRINT_COMPRESSION_LEVEL:-6}
      - CONTENT_WORKER_THREADS_ENABLED=${CONTENT_WORKER_THREADS_ENABLED:-1}
      - CONTENT_WORKER_POOL_SIZE=${CONTENT_WORKER_POOL_SIZE:-0}
      - CONTENT_WORKER_QUEUE_MAX=${CONTENT_WORKER_QUEUE_MAX:-8}
      - CONTENT_WORKER_IDLE_TTL_MS=${CONTENT_WORKER_IDLE_TTL_MS:-30000}
      - CONTENT_MAIN_THREAD_FALLBACK_MAX_BYTES=${CONTENT_MAIN_THREAD_FALLBACK_MAX_BYTES:-8388608}
      - CONTENT_DISK_CACHE_MIN_BYTES=${CONTENT_DISK_CACHE_MIN_BYTES:-1048576}
      - SEARCH_PERFORMANCE_PROFILE=${SEARCH_PERFORMANCE_PROFILE:-auto}
      - SEARCH_STORAGE_PROFILE=${SEARCH_STORAGE_PROFILE:-auto}
      - SEARCH_SERVER_CORES=${SEARCH_SERVER_CORES:-0}
      - SEARCH_FULL_CONCURRENCY_MAX=${SEARCH_FULL_CONCURRENCY_MAX:-0}
      - SEARCH_LIVE_CONCURRENCY_MAX=${SEARCH_LIVE_CONCURRENCY_MAX:-0}
      - SEARCH_MULTI_EPISODE_CONCURRENCY_MAX=${SEARCH_MULTI_EPISODE_CONCURRENCY_MAX:-0}
      - SEARCH_CACHE_ONLY_CONCURRENCY=${SEARCH_CACHE_ONLY_CONCURRENCY:-0}
      - SEARCH_WORKER_BATCH_MAX=${SEARCH_WORKER_BATCH_MAX:-0}
      - METADATA_FETCH_ENABLED=${METADATA_FETCH_ENABLED:-1}
      - METADATA_STORE_COMPRESSION_LEVEL=${METADATA_STORE_COMPRESSION_LEVEL:-6}
      - METADATA_PLAYWRIGHT_ENABLED=${METADATA_PLAYWRIGHT_ENABLED:-1}
      - METADATA_PLAYWRIGHT_HEADLESS=${METADATA_PLAYWRIGHT_HEADLESS:-1}
      - METADATA_PLAYWRIGHT_NO_SANDBOX=${METADATA_PLAYWRIGHT_NO_SANDBOX:-0}
      - METADATA_PLAYWRIGHT_EXECUTABLE_PATH=${METADATA_PLAYWRIGHT_EXECUTABLE_PATH:-}
      - METADATA_PLAYWRIGHT_TIMEOUT_MS=${METADATA_PLAYWRIGHT_TIMEOUT_MS:-30000}
      - METADATA_PLAYWRIGHT_SETTLE_MS=${METADATA_PLAYWRIGHT_SETTLE_MS:-900}
      - METADATA_REQUEST_TIMEOUT_MS=${METADATA_REQUEST_TIMEOUT_MS:-10000}
      - METADATA_RESPONSE_MAX_BYTES=${METADATA_RESPONSE_MAX_BYTES:-2097152}
      - METADATA_COVER_MAX_BYTES=${METADATA_COVER_MAX_BYTES:-5242880}
      - METADATA_COVER_CACHE_MAX_BYTES=${METADATA_COVER_CACHE_MAX_BYTES:-2147483648}
      - METADATA_COVER_ORPHAN_MIN_AGE_MS=${METADATA_COVER_ORPHAN_MIN_AGE_MS:-604800000}
      - METADATA_COVER_PRUNE_INTERVAL_MS=${METADATA_COVER_PRUNE_INTERVAL_MS:-21600000}
      - METADATA_COVER_PRUNE_MAX_DELETE_PER_RUN=${METADATA_COVER_PRUNE_MAX_DELETE_PER_RUN:-200}
      - METADATA_REQUEST_INTERVAL_MS=${METADATA_REQUEST_INTERVAL_MS:-3000}
      - METADATA_QUEUE_CONCURRENCY=${METADATA_QUEUE_CONCURRENCY:-1}
      - METADATA_QUEUE_MAX=${METADATA_QUEUE_MAX:-2000}
      - METADATA_AUTO_APPLY_THRESHOLD=${METADATA_AUTO_APPLY_THRESHOLD:-0.95}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - .env
